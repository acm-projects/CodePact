<body>
 <h2>Available Groups</h2>
 <div id="groupsContainer"></div>


 <script>
   async function loadGroups() {
     try {
       console.log("Smile");
       const res = await fetch("http://localhost:3000/getGroupList");
       const groups = await res.json();
       console.log("Hello World");
       console.log(groups);
       const container = document.getElementById("groupsContainer");
       container.innerHTML = "";
      
       groups.forEach(group => {
         const btn = document.createElement("button");
         btn.innerText = group.name;
         btn.onclick = () => {
           fetch(`http://localhost:3000/changeUserGroups?name=${encodeURIComponent("Tharun")}&groupName=${encodeURIComponent(group.name)}`);
           
           loadGroups2();
         }
         container.appendChild(btn);
         container.appendChild(document.createElement("br"));
       });
     } catch (err) {
       console.error("Error fetching groups:", err);
     }
   }


   // load groups when the page loads
 loadGroups();
 </script>

<h2>Name List Test</h2>
<div id = "names"></div>
<script>
  async function nameListRetriver(groupName) {
    try {

      const res = await fetch(`http://localhost:3000/getMembers?groupName=${encodeURIComponent(groupName)}`);
      const names = await res.json();
      console.log(names);

      const container = document.getElementById("names");
      container.innerHTML = "";

      names.forEach(name => {
        const nameElement = document.createElement("button");
        nameElement.innerText = name;
        nameElement.onclick = () => {
           fetch(`http://localhost:3000/deleteUserFromGroup?groupName=${encodeURIComponent(groupName)}&name=${encodeURIComponent(name)}`);
           nameListRetriver(groupName);
        }
        container.appendChild(nameElement);
      });
    } catch (err) {
      console.error("Error fetching name list:", err);
    }
  }
</script>
